version: '3.8'

services:
  postgres:
    # pgvector/pgvector bundles the pgvector extension on top of the stock
    # postgres image -- required for the pgvector-based recommendation engine
    # (see infrastructure/external-services/postgres-recommendation), which
    # replaced Elasticsearch's brute-force cosine-similarity scoring.
    #
    # PINNED BY DIGEST, deliberately. The floating `:pg16` tag once moved to a
    # build with a different glibc while `postgres_data` persisted; text
    # collation changed underneath the existing B-tree indexes, silently
    # corrupting their sort order. `music_tracks_filePath_key` then stopped
    # matching rows that were really there, so the scanner's upsert took its
    # create branch and inserted duplicate tracks. Re-pin (and REINDEX) only as
    # a deliberate, verified upgrade -- never by letting the tag drift.
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: muzo-postgres
    environment:
      - POSTGRES_USER=muzo
      - POSTGRES_PASSWORD=muzo
      - POSTGRES_DB=muzo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U muzo']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - muzo-network
  redis:
    image: redis:7-alpine
    container_name: muzo-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - muzo-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  muzo-network:
    driver: bridge

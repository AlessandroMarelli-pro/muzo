version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: muzo-postgres
    environment:
      - POSTGRES_USER=muzo
      - POSTGRES_PASSWORD=muzo
      - POSTGRES_DB=muzo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U muzo']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - muzo-network
  redis:
    image: redis:7-alpine
    container_name: muzo-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - muzo-network
  slskd:
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SLSK_USERNAME=maestropolis75
      - SLSKD_SLSK_PASSWORD=Musorga75&
    image: slskd/slskd:latest
    container_name: muzo-slskd
    ports:
      - '5030:5030'
      - '5031:5031'
      - '50300:50300'
    volumes:
      - slskd_app:/app
      - slskd_downloads:/downloads
    restart: unless-stopped
    networks:
      - muzo-network
  sockseek:
    build:
      context: ./third_party/sockseek
    container_name: muzo-sockseek
    entrypoint:
      - sockseek
      - daemon
      - --server-ip
      - '0.0.0.0'
      - --server-port
      - '5040'
      - --config
      - /config/sockseek.conf
      - -p
      - /data
    command: []
    ports:
      - '5040:5040'
    volumes:
      - sockseek_config:/config
      - sockseek_data:/data
    restart: unless-stopped
    networks:
      - muzo-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  slskd_app:
    driver: local
  slskd_downloads:
    driver: local
  sockseek_config:
    driver: local
  sockseek_data:
    driver: local

networks:
  muzo-network:
    driver: bridge

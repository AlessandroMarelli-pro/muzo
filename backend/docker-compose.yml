version: '3.8'

services:
  postgres:
    # pgvector/pgvector bundles the pgvector extension on top of the stock
    # postgres image -- required for the pgvector-based recommendation engine
    # (see infrastructure/external-services/postgres-recommendation), which
    # replaced Elasticsearch's brute-force cosine-similarity scoring.
    image: pgvector/pgvector:pg16
    container_name: muzo-postgres
    environment:
      - POSTGRES_USER=muzo
      - POSTGRES_PASSWORD=muzo
      - POSTGRES_DB=muzo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U muzo']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - muzo-network
  redis:
    image: redis:7-alpine
    container_name: muzo-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - muzo-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  muzo-network:
    driver: bridge

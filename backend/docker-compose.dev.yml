version: '3.8'

services:
  redis-dev:
    image: redis:7-alpine
    container_name: muzo-redis-dev
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes --save 60 1
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - muzo-dev-network
  slskd-dev:
    image: slskd/slskd:latest
    container_name: muzo-slskd-dev
    ports:
      - '5030:5030'
    volumes:
      - slskd_dev_app:/app
      - slskd_dev_downloads:/downloads
    restart: unless-stopped
    networks:
      - muzo-dev-network
  sockseek-dev:
    build:
      context: ./third_party/sockseek
    container_name: muzo-sockseek-dev
    entrypoint:
      - sockseek
      - daemon
      - --server-ip
      - '0.0.0.0'
      - --server-port
      - '5040'
      - --config
      - /config/sockseek.conf
      - -p
      - /data
    command: []
    ports:
      - '5040:5040'
    volumes:
      - sockseek_dev_config:/config
      - sockseek_dev_data:/data
    restart: unless-stopped
    networks:
      - muzo-dev-network

volumes:
  redis_dev_data:
    driver: local
  slskd_dev_app:
    driver: local
  slskd_dev_downloads:
    driver: local
  sockseek_dev_config:
    driver: local
  sockseek_dev_data:
    driver: local

networks:
  muzo-dev-network:
    driver: bridge

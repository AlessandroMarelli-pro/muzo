server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TanStack Router is a client-side SPA router (createRouter, no SSR) --
    # any path that isn't a real static file falls back to index.html so
    # deep links and refreshes on client-side routes work correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets get long-lived caching; index.html itself must not be
    # cached, since it's the entry point that references the current
    # content-hashed asset filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

name: Build ai-service GPU image

# Builds essentia-tensorflow's Python bindings for Linux/amd64 (no wheel has
# been published to PyPI since Python 3.7 -- see ai-service/docker/essentia-gpu.Dockerfile
# for details). Runs on a native amd64 GitHub-hosted runner, avoiding the
# QEMU emulation tax of building this locally on Apple Silicon.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-service/docker/essentia-gpu.Dockerfile'
      - 'ai-service/requirements.txt'
      - 'ai-service/.dockerignore'
      - 'ai-service/models/essentia_cache/**'
      - '.github/workflows/ai-service-gpu-image.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ai-service-gpu

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          file: ai-service/docker/essentia-gpu.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify essentia + tensorflow import together in the built image
        run: |
          # metadata-action already lowercases the image reference correctly
          # (github.repository preserves original case, which docker run
          # rejects) -- take the first tag from its own tags output.
          IMAGE_REF=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          # Import essentia AND tensorflow in one interpreter: this is the
          # combination that Essentia's `setup_from_python.sh --mode python` TF
          # setup is meant to make safe. A protobuf `undefined symbol` here would
          # mean the link is wrong. (Real GPU inference still needs a CUDA host.)
          docker run --rm "$IMAGE_REF" python3.11 -c "
          import essentia, essentia.standard as es
          import tensorflow as tf
          print('essentia', essentia.__version__, '/ tf', tf.__version__)
          assert hasattr(es, 'TensorflowPredictEffnetDiscogs')
          # Load a baked .pb graph -- catches a truncated / stale-LFS-pointer .pb
          # ('Error importing graph. Invalid GraphDef').
          import os
          cache = 'models/essentia_cache'
          pbs = sorted(f for f in os.listdir(cache) if f.endswith('.pb'))
          assert pbs, 'no .pb files baked into image at ' + cache
          for f in pbs:
              size = os.path.getsize(os.path.join(cache, f))
              assert size > 10_000, f'{f} is {size}B -- truncated or a stale LFS pointer stub'
          es.TensorflowPredictEffnetDiscogs(
              graphFilename=os.path.join(cache, 'discogs-effnet-bs64-1.pb'),
              output='PartitionedCall:1',
          )
          print(f'OK: {len(pbs)} model graphs present, discogs-effnet loads')
          "

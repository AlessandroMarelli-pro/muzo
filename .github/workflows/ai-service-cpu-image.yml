name: Build ai-service CPU image

# CPU-only counterpart to ai-service-gpu-image.yml -- see
# ai-service/docker/essentia-cpu.Dockerfile for why this exists (GPU
# inference crash, unresolved). Runs on a native amd64 GitHub-hosted runner,
# avoiding the QEMU emulation tax of building this locally on Apple Silicon.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-service/docker/essentia-cpu.Dockerfile'
      - 'ai-service/requirements.txt'
      - 'ai-service/.dockerignore'
      - 'ai-service/models/essentia_cache/**'
      - '.github/workflows/ai-service-cpu-image.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ai-service-cpu

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          file: ai-service/docker/essentia-cpu.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify essentia + baked models load in the built image
        run: |
          # metadata-action already lowercases the image reference correctly
          # (github.repository preserves original case, which docker run
          # rejects) -- take the first tag from its own tags output.
          IMAGE_REF=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm "$IMAGE_REF" python3.11 -c "
          import essentia, essentia.standard as es
          print('essentia', essentia.__version__)
          assert hasattr(es, 'TensorflowPredictEffnetDiscogs')
          # Actually load a baked .pb graph -- 'import essentia' alone would not
          # catch a truncated / stale-LFS-pointer .pb ('Error importing graph.
          # Invalid GraphDef' at load, silent key-only analysis at runtime).
          import os
          cache = 'models/essentia_cache'
          pbs = sorted(f for f in os.listdir(cache) if f.endswith('.pb'))
          assert pbs, 'no .pb files baked into image at ' + cache
          for f in pbs:
              size = os.path.getsize(os.path.join(cache, f))
              assert size > 10_000, f'{f} is {size}B -- truncated or a stale LFS pointer stub'
          es.TensorflowPredictEffnetDiscogs(
              graphFilename=os.path.join(cache, 'discogs-effnet-bs64-1.pb'),
              output='PartitionedCall:1',
          )
          print(f'OK: {len(pbs)} model graphs present, discogs-effnet loads')
          "

name: Build ai-service CPU image

# CPU-only counterpart to ai-service-gpu-image.yml -- see
# ai-service/docker/essentia-cpu.Dockerfile for why this exists (GPU
# inference crash, unresolved).
#
# Multi-arch (amd64 + arm64): the app's Docker Compose local-ai mode needs a
# native image on arm64 hosts (Apple Silicon) -- an amd64-only image would
# run under QEMU, which is unusably slow for the TensorFlow inference this
# service does on every request. The repo is public, so GitHub provides free
# native `ubuntu-24.04-arm` runners for the arm64 leg -- no QEMU cross-build
# tax either. Each arch builds and pushes its own image BY DIGEST (untagged),
# then a final job assembles both digests into one multi-arch manifest under
# the real tags, so `docker pull` on either host architecture transparently
# gets its native image. See essentia-cpu.Dockerfile's TARGETARCH usage for
# the one arch-specific line this depends on (the community libtensorflow_cc
# .deb, published upstream for both arches).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-service/docker/essentia-cpu.Dockerfile'
      - 'ai-service/requirements.txt'
      - 'ai-service/.dockerignore'
      - 'ai-service/models/essentia_cache/**'
      - '.github/workflows/ai-service-cpu-image.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ai-service-cpu

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name (lowercased -- github.repository preserves case, which the registry rejects)
        id: image
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set arch tag suffix
        id: arch
        run: echo "suffix=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push (by digest, untagged -- the manifest job below applies the real tags)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          file: ai-service/docker/essentia-cpu.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # A digest-only push still needs *some* tag to land under; this one is an
          # implementation detail consumers should never reference directly -- use
          # `:latest` (assembled below), not `:<sha>-<arch>`.
          tags: ${{ steps.image.outputs.name }}:build-${{ github.sha }}-${{ steps.arch.outputs.suffix }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Verify essentia + baked models load in the built image
        run: |
          IMAGE_REF="${{ steps.image.outputs.name }}:build-${{ github.sha }}-${{ steps.arch.outputs.suffix }}"
          docker run --rm --platform ${{ matrix.platform }} "$IMAGE_REF" python3.11 -c "
          import essentia, essentia.standard as es
          print('essentia', essentia.__version__)
          assert hasattr(es, 'TensorflowPredictEffnetDiscogs')
          # Actually load a baked .pb graph -- 'import essentia' alone would not
          # catch a truncated / stale-LFS-pointer .pb ('Error importing graph.
          # Invalid GraphDef' at load, silent key-only analysis at runtime).
          import os
          cache = 'models/essentia_cache'
          pbs = sorted(f for f in os.listdir(cache) if f.endswith('.pb'))
          assert pbs, 'no .pb files baked into image at ' + cache
          for f in pbs:
              size = os.path.getsize(os.path.join(cache, f))
              assert size > 10_000, f'{f} is {size}B -- truncated or a stale LFS pointer stub'
          es.TensorflowPredictEffnetDiscogs(
              graphFilename=os.path.join(cache, 'discogs-effnet-bs64-1.pb'),
              output='PartitionedCall:1',
          )
          print(f'OK: {len(pbs)} model graphs present, discogs-effnet loads')
          "

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.arch.outputs.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (real tags for the assembled multi-arch manifest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Prepare image name (lowercased)
        id: image
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(for tag in ${{ steps.meta.outputs.tags }}; do echo "--tag $tag"; done) \
            $(for digest in *; do echo "${{ steps.image.outputs.name }}@sha256:$digest"; done)

      - name: Inspect assembled manifest
        run: docker buildx imagetools inspect ${{ steps.image.outputs.name }}:latest
